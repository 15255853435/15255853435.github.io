

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
            border: 1px solid black;
            float: left;
            margin-left: 20px;
        }
        .box1 {
            /*默认从内部向外部渐变*/
            background-image: radial-gradient(red,yellow,green)
        }
        .box2 {
            /*关键词设置圆心位置*/
            background-image: radial-gradient(at right top,red,yellow,green)
        }
        .box3 {
            /* 像素值设置圆心位置 */
            background-image: radial-gradient(at 20px 30px,red,yellow,green)
        }
        .box4 {
            /* circle关键字设置为正圆 */
            background-image: radial-gradient(circle,red,yellow,green)
        }
        .box5 {
            /* 通过像素值设置渐变形状 */
            background-image: radial-gradient(100px 100px,red,yellow,green)
        }
        .box6 {
            /* 设置渐变区域 */
            background-image: radial-gradient(red 50px,yellow 70px,green 100px)
        }
        .box7 {
            /* 综合写法 */
            background-image: radial-gradient(100px 50px at 100px 40px,red 50px,yellow 70px,green 100px)
        }
    </style>
</head>
<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>
    <div class="box box7"></div>
</body>
</html>
